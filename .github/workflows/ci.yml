name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version go.mod allows, and the current one. A vendor on an
        # older toolchain must not be told to upgrade Go to check a license.
        go: ["1.22", "stable"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race matters here: an application may well call Validate from several
      # goroutines, and the cache is shared state.
      - name: go test
        run: go test -race ./...

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      # This package is embedded in other people's products. A known-vulnerable
      # dependency here is their problem before it is ours.
      - name: govulncheck
        run: |
          # Pinned, not @latest.
          #
          # govulncheck v1.8.0 requires Go 1.26 and this job runs 1.25 with
          # GOTOOLCHAIN=local, so @latest broke the build one morning with no
          # change on our side. A security scanner that silently follows
          # upstream is a scanner that stops the deploy for reasons unrelated to
          # our code. v1.7.0 is the newest release that still builds on 1.25;
          # raise both together when the toolchain moves.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
